name: Build and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-tests:
    name: Linux tests and format
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libx11-xcb-dev libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev
      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version --verbose
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - name: Test packaging helpers
        run: python3 -m unittest discover -s packaging -p 'test_*.py' -v

  windows-package:
    name: Windows x64 setup and portable
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      # Avoid requiring the separate MSVC Redistributable for these binaries.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --target x86_64-pc-windows-msvc --all-targets
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc --bins
      - name: Test packaging helpers
        run: python -m unittest discover -s packaging -p 'test_*.py' -v
      - name: Test per-user PATH integration
        shell: pwsh
        run: ./packaging/test-user-path.ps1
      - name: Install pinned NSIS
        run: choco install nsis --version=3.11 -y --no-progress
      - name: Package exact release binaries
        shell: pwsh
        run: ./packaging/package-windows.ps1
      - name: Measure idle and check normal GUI close
        shell: pwsh
        run: ./packaging/smoke-windows.ps1
      - name: Upload setup, portable ZIP, checksums, and smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spark-code-windows-x64-${{ github.sha }}
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
            dist/*-SHA256SUMS.txt
            dist/windows-smoke.json
          if-no-files-found: error
          retention-days: 30
