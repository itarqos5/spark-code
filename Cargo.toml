[package]
name = "spark-code"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native subscription-backed coding workspace"
repository = "https://github.com/itarqos5/spark-code"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
