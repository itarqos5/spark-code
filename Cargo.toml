[package]
name = "spark-code"
version = "1.1.3"
edition = "2024"
license = "MIT"
description = "A lean native coding workspace for subscription-backed Codex and Claude Code"
repository = "https://github.com/itarqos5/spark-code"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "svg", "x11", "tokio", "canvas", "markdown", "highlighter", "advanced", "sysinfo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
rusqlite = { version = "0.38", features = ["bundled"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"

[[bin]]
name = "spark-code-desktop"
path = "src/main.rs"

[[bin]]
name = "spark-code"
path = "src/bin/tui.rs"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
